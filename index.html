<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Booknook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F5F4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Booknook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%224%22 width=%2220%22 height=%2224%22 rx=%223%22 fill=%22%231F5F4A%22/%3E%3Crect x=%226%22 y=%224%22 width=%225%22 height=%2224%22 rx=%223%22 fill=%22%23134235%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout concept: a shelf of book rows (spine tile + title), one tab per job, bottom tab bar for thumbs. */
:root{
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --font-book:"Newsreader",Georgia,"Times New Roman",serif;
  --bg:#EFF2EE; --surface:#FAFBF9; --surface-2:#E3E9E2; --line:#CBD3CA;
  --fg:#17211C; --muted:#53615A;
  --accent:#1F5F4A; --accent-fg:#F4F8F5; --accent-soft:#D3E6DB;
  --amber-bg:#F3E3BD; --amber-fg:#6B4A06; --slate-bg:#D9E2EC; --slate-fg:#24425F;
  --danger:#9B2C2C;
  --sp0:#1F5F4A; --sp1:#8A5A12; --sp2:#7A2E34; --sp3:#35557A; --sp4:#5B6B2A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1512; --surface:#171F1B; --surface-2:#212B26; --line:#2D3933;
    --fg:#E4EBE6; --muted:#9BA89F;
    --accent:#6CC3A0; --accent-fg:#0B1A13; --accent-soft:#1D3A2E;
    --amber-bg:#3A2E12; --amber-fg:#E8C77A; --slate-bg:#1E2C3B; --slate-fg:#A9C4E2;
    --danger:#E58A8A; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3,p,ul{margin:0;padding:0}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.boot{padding:48px 16px;text-align:center;color:var(--muted)}
.wrap{max-width:680px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.tag{color:var(--muted);margin-top:4px}
.stack{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;flex:none}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.c0{background:var(--sp0)}.c1{background:var(--sp1)}.c2{background:var(--sp2)}.c3{background:var(--sp3)}.c4{background:var(--sp4)}
.avs .av+.av{margin-left:-9px}
.av.sm{border:0;width:24px;height:24px}
.stack b{font-weight:600}

.notes{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.note-box{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;background:var(--accent-soft)}
.note-box.warn{background:var(--amber-bg);color:var(--amber-fg)}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px}
h2{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.lede{color:var(--muted);margin-top:4px;max-width:60ch}
.label{margin-top:26px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}

.card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-main{min-width:0}
.card-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.bt{font-family:var(--font-book);font-weight:600;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.au{color:var(--muted);overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.quote{font-family:var(--font-book);font-size:16px;line-height:1.45;margin-top:8px;overflow-wrap:anywhere}
.spine{width:44px;height:62px;display:grid;place-items:center;border-radius:3px 7px 7px 3px;font-family:var(--font-book);font-weight:600;font-size:24px;color:#fff;
  background:linear-gradient(90deg,rgba(0,0,0,.3) 0 6px,rgba(255,255,255,.12) 6px 7px,transparent 7px),var(--sp);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset}
.s0{--sp:var(--sp0)}.s1{--sp:var(--sp1)}.s2{--sp:var(--sp2)}.s3{--sp:var(--sp3)}.s4{--sp:var(--sp4)}
.date{width:44px;border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;background:var(--bg);align-self:start}
.date span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.date b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1}
.card.past{opacity:.78}
.booktitle{font-family:var(--font-book);font-size:15px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%;margin-top:6px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.rate{min-width:36px;padding:6px 0}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}
.chip.amber{background:var(--amber-bg);color:var(--amber-fg)}
.chip.slate{background:var(--slate-bg);color:var(--slate-fg)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.empty{margin-top:14px;padding:26px 18px;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.empty h3{font-family:var(--font-display);font-size:18px}
.empty p{color:var(--muted);max-width:52ch}
.empty .btn{margin-top:8px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:9px 4px 8px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;line-height:18px;text-align:center}

.gate{min-height:100vh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gate-card{width:100%;max-width:400px}
.gate-card .meta{margin-top:14px}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(8,12,10,.55)}
.sheet-panel{position:relative;width:100%;max-width:680px;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:14px}
.vsel{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.vsel select{min-height:40px;padding:6px 10px;font-size:15px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;max-width:100%}
.gh{margin:22px 0 2px;font-family:var(--font-display);font-size:17px}
.gh span{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.gen{margin-top:4px}.gen .chip{margin-left:0}
.btn.newc{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
.newbox{margin-top:14px}.newlist{display:flex;flex-wrap:wrap;gap:8px}
.tab.has-new::after{content:"";position:absolute;top:8px;left:calc(50% + 2px);width:9px;height:9px;border-radius:50%;background:#D9822B;border:2px solid var(--surface)}
.comment.new .cbody{border-left:3px solid var(--accent);padding-left:9px}
.thread{max-height:42vh;overflow-y:auto;display:grid;gap:12px;margin:4px 0 8px;padding-right:2px}
.comment{display:flex;gap:10px;align-items:flex-start}
.cbody{min-width:0;flex:1}
.cbody .ctext{margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.cbody .spoiler{margin-top:4px}
.cbody .btn{margin-top:4px}
.checkrow{margin-top:12px}
.checkrow label{display:flex;gap:8px;align-items:center;min-height:44px;font-size:14px;font-weight:500}
.checkrow input{width:20px;height:20px;accent-color:var(--accent)}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-weight:600;font-size:14px}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.field input,.field textarea,.field select{width:100%;min-height:44px;padding:10px 12px;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.field textarea{min-height:84px;resize:vertical}
.err{color:var(--danger);min-height:1.4em;margin-top:10px;font-size:14px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.mlist{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:14px}
.mrow{display:flex;align-items:center;gap:10px;min-height:36px}

/* game corner */
.head.sub{margin-top:22px}
.head.sub h3{font-family:var(--font-display);font-size:18px}
.gnote{margin-top:14px;display:block}
.clues{list-style:none;padding:0;display:grid;gap:6px;margin:10px 0 0}
.clues li,.stmt{display:flex;gap:10px;align-items:flex-start}
.cn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;display:inline-grid;place-items:center;margin-top:1px}
.stmts{display:grid;gap:8px;margin-top:10px}
.stmt{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:left;width:100%;overflow-wrap:anywhere;line-height:1.4}
button.stmt{cursor:pointer;min-height:44px}
button.stmt:hover{border-color:var(--muted)}
.stmt.armed{border-color:var(--accent);background:var(--accent-soft)}
.stmt.lie{border-color:var(--amber-fg);background:var(--amber-bg)}
.cover{width:132px;max-width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:3px 8px 8px 3px;background:var(--surface-2);margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.25);display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cvfail{font-size:13px;color:var(--muted);padding:8px;text-align:center}
.cvres{margin-top:12px}
.cvgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cvpick{padding:0;border:2px solid transparent;border-radius:6px;background:none;cursor:pointer;line-height:0}
.cvpick img{width:64px;height:96px;object-fit:cover;border-radius:4px}
.cvpick[aria-pressed="true"]{border-color:var(--accent)}
.story{font-family:var(--font-book);font-size:17px;line-height:1.6;margin-top:10px;overflow-wrap:anywhere}
.sent{border-bottom:2px solid var(--sp);padding-bottom:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.rank{width:22px;color:var(--muted);font-weight:600;text-align:center}
.mrow.lb b{margin-left:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,520px);padding:10px 16px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:14px;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet-panel{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>

<p class="boot" id="boot">Loading Booknook&hellip;</p>
<script>
setTimeout(function(){var b=document.getElementById('boot');if(b&&!b.hidden)b.textContent='Booknook could not start. Check your internet connection and reload. If it keeps happening, see the troubleshooting section of the README.';},8000);
</script>

<section class="gate" id="gate" hidden>
  <div class="gate-card">
    <h1>Booknook</h1>
    <p class="tag">A private book club</p>
    <form id="gate-form" novalidate>
      <div id="gate-fields"></div>
      <p class="err" id="gate-err" role="alert"></p>
      <button type="submit" class="btn primary wide" id="gate-submit">Sign in</button>
      <button type="button" class="btn quiet wide" id="gate-reset" hidden>Forgot password?</button>
    </form>
    <p class="meta" id="gate-help"></p>
  </div>
</section>

<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Booknook</h1>
        <p class="tag" id="tagline">A private book club</p>
      </div>
      <div id="memberbtn"></div>
    </header>
    <div class="notes" id="notes"></div>
    <main id="view"></main>
  </div>

  <nav class="tabs" aria-label="Sections">
    <div class="tabs-in">
      <a class="tab" href="#reading" data-tab="reading">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>
        Reading<span class="badge" id="b-reading" hidden></span></a>
      <a class="tab" href="#ideas" data-tab="ideas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
        Ideas<span class="badge" id="b-ideas" hidden></span></a>
      <a class="tab" href="#swap" data-tab="swap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg>
        Swap<span class="badge" id="b-swap" hidden></span></a>
      <a class="tab" href="#games" data-tab="games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.1" fill="currentColor" stroke="none"/></svg>
        Games<span class="badge" id="b-games" hidden></span></a>
      <a class="tab" href="#meetups" data-tab="meetups">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        Meetups<span class="badge" id="b-meetups" hidden></span></a>
    </div>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <form class="sheet-panel" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="btn quiet" id="sheet-close" data-close>Close</button>
    </div>
    <div id="sheet-body"></div>
    <p class="err" id="sheet-err" role="alert"></p>
    <div class="sheet-foot"><span id="sheet-extra"></span><button type="submit" class="btn primary" id="sheet-submit">Save</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script type="module">
import * as FA from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import * as FAUTH from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import * as FS from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

(function(){
'use strict';
var CFG=(window.BOOKNOOK_CONFIG||{}).firebase||{};
var GENRES=["Literary fiction", "Mystery & thriller", "Science fiction", "Fantasy", "Romance", "Historical fiction", "Young adult", "Graphic novel", "Biography & memoir", "History", "Science & nature", "Self-improvement", "Business", "Philosophy & religion", "Poetry & drama", "Essays", "Other"];
var COLS={members:'members',lists:'books',recs:'ideas',swaps:'swaps',meetups:'meetups',comments:'comments',puzzles:'puzzles',truths:'truths',stories:'stories'};
// Collections the app can live without if the newest rules are not published yet.
var OPTIONAL={comments:1,puzzles:1,truths:1,stories:1};
var TABS=['reading','ideas','swap','games','meetups'];
var state={seen:{},seenReady:false,seenOff:false,marked:{},openSeen:0,discuss:null,shown:{},comments:[],commentsOff:false,uid:null,ready:{},loaded:false,denied:false,error:null,unsubs:[],
  lists:[],recs:[],swaps:[],meetups:[],members:[],puzzles:[],truths:[],stories:[],off:{},gameTab:'guess',pickedCover:'',filter:'all',armed:null,
  opts:{reading:{genre:'all',sort:'default',group:false},ideas:{genre:'all',sort:'default',group:false},swap:{genre:'all',sort:'default',group:false}}};
var auth=null,db=null,gateMode='',busy=new Set(),armT=0,toastT=0,schedT=0,sheetOpts=null,lastFocus=null;

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function count(o){return Object.values(o||{}).filter(function(v){return v===true;}).length;}
function mine(o){return !!o && o[state.uid]===true;}
function isMember(){return state.members.some(function(m){return m.id===state.uid;});}
function canWrite(){return !!state.uid && isMember();}
function hue(s){var h=0;String(s||'').split('').forEach(function(c){h=(h*31+c.charCodeAt(0))>>>0;});return h%5;}
function toLocalInput(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function nextSaturday(){var d=new Date();d.setDate(d.getDate()+(((6-d.getDay()+7)%7)||7));d.setHours(15,0,0,0);return toLocalInput(d);}
function curTab(){var h=location.hash.slice(1);return TABS.indexOf(h)>=0?h:'reading';}

function nameOf(uid,plain){
  if(!uid) return 'someone';
  if(uid===state.uid && !plain) return 'you';
  var m=state.members.find(function(x){return x.id===uid;});
  return m&&m.nick?m.nick:(uid===state.uid?'You':'a friend');
}
function who(uid){return esc(nameOf(uid));}
function Who(uid){return esc(cap(nameOf(uid)));}
function av(uid,cls){return '<span class="av '+(cls||'')+' c'+hue(uid)+'" aria-hidden="true">'+esc(nameOf(uid,true).charAt(0).toUpperCase())+'</span>';}

function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},4200);
}
function writeError(e){
  if(e&&e.userMessage) return e.userMessage;
  var c=e&&e.code;
  if(c==='permission-denied') return "That is not allowed. Things may have changed since you opened the page.";
  if(c==='unavailable'||c==='auth/network-request-failed') return 'No connection. Check your internet and try again.';
  if(c==='auth/requires-recent-login') return 'For security, sign out and sign back in, then change your password straight away.';
  return "That didn't save. Try again in a moment.";
}

/* ---------- live data ---------- */
function ts(t){return t&&t.toMillis?t.toMillis():0;}
var MAP={
  members:function(d){return {id:d.id,nick:d.nick||''};},
  lists:function(d){
    var rd={};Object.keys(d.readers||{}).forEach(function(k){var v=d.readers[k]||{};rd[k]={s:v.s,at:ts(v.at)};});
    return {id:d.id,title:d.title,author:d.author,note:d.note,by:d.createdBy,suggestedBy:d.suggestedBy||'',
      genre:d.genre||'',createdAt:ts(d.createdAt),readers:rd,votes:d.votes||{},ratings:d.ratings||{}};},
  comments:function(d){return {id:d.id,bookId:d.bookId,text:d.text,spoiler:!!d.spoiler,by:d.createdBy,createdAt:ts(d.createdAt)};},
  recs:function(d){return {genre:d.genre||'',id:d.id,title:d.title,author:d.author,why:d.why,by:d.createdBy,createdAt:ts(d.createdAt),backs:d.backs||{}};},
  swaps:function(d){return {genre:d.genre||'',id:d.id,title:d.title,author:d.author,note:d.note,owner:d.ownerId,status:d.status,
    requestedBy:d.requestedBy||'',borrowedBy:d.borrowedBy||'',createdAt:ts(d.createdAt)};},
  meetups:function(d){return {id:d.id,title:d.title,when:d.startsAt&&d.startsAt.toDate?d.startsAt.toDate():null,place:d.place,book:d.book,notes:d.notes,
    by:d.createdBy,createdAt:ts(d.createdAt),rsvp:d.rsvp||{}};},
  puzzles:function(d){
    var sv={};Object.keys(d.solves||{}).forEach(function(k){var v=d.solves[k]||{};sv[k]={pts:v.pts||0,at:ts(v.at)};});
    return {id:d.id,kind:d.kind,answer:d.answer||'',clues:d.clues||[],cover:d.cover||'',stepHrs:d.stepHrs||24,by:d.createdBy,createdAt:ts(d.createdAt),solves:sv};},
  truths:function(d){return {id:d.id,book:d.book||'',stmts:d.stmts||[],lie:d.lie,by:d.createdBy,createdAt:ts(d.createdAt),picks:d.picks||{}};},
  stories:function(d){return {id:d.id,title:d.title||'',parts:d.parts||[],lastBy:d.lastBy||'',done:!!d.done,by:d.createdBy,createdAt:ts(d.createdAt)};}
};
function resetData(){
  state.ready={};state.loaded=false;state.denied=false;state.error=null;
  state.seen={};state.seenReady=false;state.seenOff=false;state.marked={};state.lists=[];state.comments=[];state.recs=[];state.swaps=[];state.meetups=[];state.members=[];
  state.puzzles=[];state.truths=[];state.stories=[];state.off={};
}
function stopListening(){state.unsubs.forEach(function(u){try{u();}catch(e){}});state.unsubs=[];}
function startListening(){
  Object.keys(COLS).forEach(function(key){
    var un=FS.onSnapshot(FS.collection(db,COLS[key]),function(snap){
      state[key]=snap.docs.map(function(x){var d=x.data({serverTimestamps:'estimate'});d.id=x.id;return MAP[key](d);});
      state.ready[key]=true;state.off[key]=false;if(key==='comments') state.commentsOff=false;
      state.loaded=Object.keys(COLS).every(function(k){return state.ready[k];});
      state.error=null;
      schedule();
    },function(err){
      // Discussions and games are optional: if the new rules are not published yet, the rest of the app keeps working.
      if(OPTIONAL[key]&&err&&err.code==='permission-denied'){state.off[key]=true;if(key==='comments') state.commentsOff=true;state[key]=[];state.ready[key]=true;state.loaded=Object.keys(COLS).every(function(k){return state.ready[k];});schedule();return;}
      onListenError(err);});
    state.unsubs.push(un);
  });
  // Which discussion comments this person has already read (private to them, synced across their devices).
  state.unsubs.push(FS.onSnapshot(FS.doc(db,'reads',state.uid),function(snap){
    var d=snap.exists()?snap.data({serverTimestamps:'estimate'}):{};
    var m={};Object.keys(d.seen||{}).forEach(function(k){m[k]=ts(d.seen[k]);});
    state.seen=m;state.seenReady=true;state.seenOff=false;schedule();
  },function(){state.seenOff=true;state.seenReady=false;schedule();}));
}
function onListenError(err){
  if(!state.uid||state.denied) return;
  if(err&&err.code==='permission-denied'){state.denied=true;stopListening();showGate('denied');return;}
  state.error=err;schedule();
}
function afterData(){
  if(state.denied||!state.uid) return;
  if(!state.ready.members) return;
  if(!isMember()){showGate('name');return;}
  showApp();render();
}
function schedule(){clearTimeout(schedT);schedT=setTimeout(afterData,30);}
function setUser(user){
  var uid=user?user.uid:null;
  if(uid===state.uid && (uid?state.unsubs.length>0:gateMode==='signin')) return;
  stopListening();
  state.uid=uid;
  resetData();
  if(!uid){showGate('signin');return;}
  showGate('loading');
  startListening();
}

/* ---------- writes ---------- */
function ref(coll,id){return FS.doc(db,coll,id);}
function colRef(coll){return FS.collection(db,coll);}
function mapField(map,value){var o={};o[map+'.'+state.uid]=value;return o;}
function toggleMap(coll,id,map,has){return FS.updateDoc(ref(coll,id),mapField(map,has?FS.deleteField():true));}
function guarded(key,fn){
  if(busy.has(key)) return Promise.resolve();
  if(!canWrite()){toast('Sign in and pick a name first.');return Promise.resolve();}
  busy.add(key);
  return Promise.resolve().then(fn).catch(function(e){toast(writeError(e));}).then(function(){busy.delete(key);});
}
function patchDoc(key,coll,id,data){return guarded(key,function(){return FS.updateDoc(ref(coll,id),data);});}
var TABLE_OF={comments:'comments',lists:'books',recs:'ideas',swaps:'swaps',meetups:'meetups',puzzles:'puzzles',truths:'truths',stories:'stories'};
function del(coll,id){
  var key=coll+'/'+id;
  if(state.armed!==key){
    state.armed=key;clearTimeout(armT);
    armT=setTimeout(function(){state.armed=null;render();},3500);
    render();return;
  }
  state.armed=null;
  guarded(key,function(){return FS.deleteDoc(ref(TABLE_OF[coll],id));});
}
// Two-tap confirmation for actions that cannot be undone (same idea as Remove).
function twoTap(key){
  if(state.armed===key){state.armed=null;return true;}
  state.armed=key;clearTimeout(armT);
  armT=setTimeout(function(){state.armed=null;render();},3500);
  render();return false;
}
function saveNick(nick){
  var exists=state.members.some(function(m){return m.id===state.uid;});
  return exists?FS.updateDoc(ref('members',state.uid),{nick:nick}):FS.setDoc(ref('members',state.uid),{nick:nick,joinedAt:FS.serverTimestamp()});
}
function newBook(v,extra){
  var votes={};votes[state.uid]=true;
  return FS.addDoc(colRef('books'),Object.assign({genre:v.genre||'',title:v.title,author:v.author||'',note:v.note||'',suggestedBy:'',
    createdBy:state.uid,createdAt:FS.serverTimestamp(),votes:votes,ratings:{},readers:{}},extra||{}));
}
function setReader(id,s){
  return guarded('book'+id,function(){return FS.updateDoc(ref('books',id),mapField('readers',{s:s,at:FS.serverTimestamp()}));});
}
function promote(id){
  var r=state.recs.find(function(x){return x.id===id;});
  if(!r) return;
  var dup=state.lists.some(function(l){return (l.title||'').toLowerCase()===(r.title||'').toLowerCase()&&(l.author||'').toLowerCase()===(r.author||'').toLowerCase();});
  if(dup){toast('That book is already on the reading list.');return;}
  guarded('promote'+id,function(){
    return newBook({title:r.title,author:r.author,note:r.why,genre:r.genre},{suggestedBy:r.by||''}).then(function(){toast('Added to the reading list.');});
  });
}
function borrow(id){
  guarded('swap'+id,function(){
    return FS.updateDoc(ref('swaps',id),{status:'requested',requestedBy:state.uid}).catch(function(e){
      if(e&&e.code==='permission-denied'){toast('Someone just asked for this one.');return;}
      throw e;
    });
  });
}

/* ---------- views ---------- */
function btn(label,act,id,o){
  o=o||{};
  return '<button type="button" class="btn '+(o.kind||'')+'" data-act="'+act+'"'+(id!=null?' data-id="'+esc(id)+'"':'')+(o.arg!=null?' data-arg="'+esc(o.arg)+'"':'')+(o.pressed!=null?' aria-pressed="'+o.pressed+'"':'')+'>'+label+'</button>';
}
function delBtn(coll,it){
  if(!canWrite()||it.by!==state.uid) return '';
  var armed=state.armed===coll+'/'+it.id;
  return btn(armed?'Tap again to remove':'Remove','del',it.id,{arg:coll,kind:'quiet danger'});
}
function bookCard(it,extra,actions){
  var t=(it.title||'?').trim();
  return '<article class="card"><div class="spine s'+hue(t)+'" aria-hidden="true">'+esc(t.charAt(0).toUpperCase())+'</div>'+
    '<div class="card-main"><h3 class="bt">'+esc(it.title)+'</h3><p class="au">'+esc(it.author||'Author not listed')+'</p>'+(it.genre?'<p class="gen"><span class="chip slate">'+esc(it.genre)+'</span></p>':'')+(extra||'')+'</div>'+
    (actions?'<div class="card-actions">'+actions+'</div>':'')+'</article>';
}
function emptyBlock(title,text,act,label){
  return '<div class="empty"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+(canWrite()?btn(esc(label),act,null,{kind:'primary'}):'')+'</div>';
}
function loadingBlock(){return '<div class="empty"><h3>Loading the shelf</h3><p>Fetching what the group has added.</p></div>';}
function head(title,lede,act,label){
  return '<div class="head"><h2>'+esc(title)+'</h2>'+(canWrite()?btn(esc(label),act,null,{kind:'primary'}):'')+'</div><p class="lede">'+esc(lede)+'</p>';
}

function readerOf(it,uid){return (it.readers||{})[uid]||null;}
function readersLine(it){
  var ids=Object.keys(it.readers||{});
  var reading=ids.filter(function(k){return it.readers[k].s==='reading';});
  var done=ids.filter(function(k){return it.readers[k].s==='done';});
  var out='';
  if(reading.length) out+='<p class="meta">Reading now: '+reading.map(who).join(', ')+'</p>';
  if(done.length) out+='<p class="meta">Finished by: '+done.map(who).join(', ')+'</p>';
  return out;
}
function viewItems(tab,items,dflt){
  var o=state.opts[tab];
  var out=items.filter(function(x){return o.genre==='all'||(o.genre==='_none'?!x.genre:x.genre===o.genre);});
  var by=o.sort;
  function pop(x){return count(x.votes||x.backs||{});}
  if(by==='default') out.sort(dflt);
  else out.sort(function(a,b){
    if(by==='latest') return (b.createdAt||0)-(a.createdAt||0);
    if(by==='oldest') return (a.createdAt||0)-(b.createdAt||0);
    if(by==='popular') return pop(b)-pop(a)||(b.createdAt||0)-(a.createdAt||0);
    if(by==='author') return (a.author||'~').localeCompare(b.author||'~')||(a.title||'').localeCompare(b.title||'');
    return (a.title||'').localeCompare(b.title||'');
  });
  return out;
}
function cardList(tab,items,cardFn){
  if(!state.opts[tab].group) return '<div class="list">'+items.map(cardFn).join('')+'</div>';
  var out='';
  GENRES.concat(['']).forEach(function(g){
    var part=items.filter(function(x){return (x.genre||'')===g;});
    if(part.length) out+='<h4 class="gh">'+esc(g||'No genre set')+' <span>'+part.length+'</span></h4><div class="list">'+part.map(cardFn).join('')+'</div>';
  });
  return out;
}
function toolbar(tab,all,popular){
  var o=state.opts[tab];
  var present=GENRES.filter(function(g){return all.some(function(x){return x.genre===g;});});
  var anyNone=all.some(function(x){return !x.genre;});
  if(o.genre!=='all'&&present.indexOf(o.genre)<0&&!(o.genre==='_none'&&anyNone)) o.genre='all';
  var gs=[['all','All genres']].concat(present.map(function(g){return [g,g];}));
  if(anyNone&&present.length) gs.push(['_none','No genre set']);
  var ss=[['default','Default order'],['latest','Newest first'],['oldest','Oldest first']];
  if(popular) ss.push(['popular','Most '+popular]);
  ss.push(['title','Title A to Z'],['author','Author A to Z']);
  function sel(c,list,v,label){return '<label class="vsel"><span>'+label+'</span><select data-ctl="'+c+'">'+list.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>';}).join('')+'</select></label>';}
  return '<div class="vbar">'+sel('genre',gs,o.genre,'Genre')+sel('sort',ss,o.sort,'Sort')+btn('Group by genre','group',null,{pressed:o.group,kind:'quiet'})+'</div>';
}
function genreBtn(coll,it,owner){
  if(!canWrite()||owner!==state.uid) return '';
  return btn(it.genre?'Change genre':'Set genre','setgenre',it.id,{arg:coll,kind:'quiet'});
}
function ownBtns(coll,it){return genreBtn(coll,it,it.by)+delBtn(coll,it);}
function openGenre(coll,id){
  var list=coll==='lists'?state.lists:coll==='recs'?state.recs:state.swaps;
  var it=list.find(function(x){return x.id===id;});if(!it) return;
  openSheet({title:'Genre',intro:it.title,submit:'Save',fields:[{id:'genre',label:'Genre',type:'select',value:it.genre||''}],
    onSubmit:function(v){return FS.updateDoc(ref(TABLE_OF[coll],id),{genre:v.genre});}});
}
function viewReading(){
  var L=state.lists;
  var h=head('Reading list','Everyone reads at their own pace. Vote on what to pick up next, then start and finish books whenever you like.','add-book','Add a book');
  if(!state.loaded) return h+loadingBlock();
  if(!L.length) return h+emptyBlock('Nothing on the list yet','Add the book you want the group to read next. Everyone can vote, and everyone keeps their own progress.','add-book','Add a book');
  function st(it){var r=readerOf(it,state.uid);return r?r.s:'';}
  function mineAt(it){var r=readerOf(it,state.uid);return r?r.at:0;}
  var byMine=function(a,b){return mineAt(b)-mineAt(a);};
  var cur=viewItems('reading',L.filter(function(x){return st(x)==='reading';}),byMine);
  var queue=viewItems('reading',L.filter(function(x){return !st(x);}),function(a,b){return count(b.votes)-count(a.votes)||(a.createdAt||0)-(b.createdAt||0);});
  var done=viewItems('reading',L.filter(function(x){return st(x)==='done';}),byMine);
  var flt=state.opts.reading.genre!=='all';
  function lines(it){return '<p class="meta">Added by '+who(it.suggestedBy||it.by)+'</p>'+(it.note?'<p class="quote">'+esc(it.note)+'</p>':'')+readersLine(it);}
  var ub=unreadBooks();
  var banner=ub.length?'<div class="note-box newbox"><span><b>New in the discussions</b></span><span class="newlist">'+ub.map(function(x){return btn(esc(x.b.title)+' &middot; '+x.n,'discuss',x.b.id,{kind:'newc'});}).join('')+'</span></div>':'';
  var out=h+banner+toolbar('reading',L,'votes')+'<h3 class="label">You are reading</h3>';
  out+=cur.length?cardList('reading',cur,function(it){
    return bookCard(it,lines(it),btn('Mark finished','finish',it.id,{kind:'primary'})+btn('Stop reading','unstart',it.id,{kind:'quiet'})+discussBtn(it)+ownBtns('lists',it));
  }):'<div class="empty"><p>'+(flt?'No books in this genre here.':'Nothing on the go. Start one from Up next.')+'</p></div>';
  out+='<h3 class="label">Up next</h3>';
  out+=queue.length?cardList('reading',queue,function(it){
    return bookCard(it,lines(it),btn('Vote &middot; '+count(it.votes),'vote',it.id,{pressed:mine(it.votes)})+btn('Start reading','start',it.id)+discussBtn(it)+ownBtns('lists',it));
  }):'<div class="empty"><p>'+(flt?'No books in this genre here.':'Nothing left to pick up. Add a book or move one over from Ideas.')+'</p></div>';
  if(done.length){
    out+='<h3 class="label">You have finished</h3>'+cardList('reading',done,function(it){
      var rs=Object.values(it.ratings||{}).filter(function(n){return typeof n==='number'&&n>0;});
      var avg=rs.length?(rs.reduce(function(a,b){return a+b;},0)/rs.length).toFixed(1):null;
      var extra='<p class="meta">'+(avg?'Group rating '+avg+' out of 5 from '+rs.length+(rs.length===1?' reader':' readers'):'No ratings yet')+'</p>'+readersLine(it);
      var mineR=(it.ratings||{})[state.uid]||0;
      var acts='<span class="meta">Your rating</span>';
      for(var n=1;n<=5;n++) acts+=btn(String(n),'rate',it.id,{arg:n,pressed:mineR===n,kind:'rate'});
      acts+=btn('Back to reading','start',it.id,{kind:'quiet'})+discussBtn(it)+ownBtns('lists',it);
      return bookCard(it,extra,acts);
    });
  }
  return out;
}

function viewIdeas(){
  var R=state.recs;
  var h=head('Ideas','Books you think the others would enjoy. Say why, and let people back the ones they would read.','add-idea','Recommend');
  if(!state.loaded) return h+loadingBlock();
  if(!R.length) return h+emptyBlock('No recommendations yet','Share a book you loved and say why. Others can back it, and anyone can move it onto the reading list.','add-idea','Recommend a book');
  var sorted=viewItems('ideas',R,function(a,b){return count(b.backs)-count(a.backs)||(b.createdAt||0)-(a.createdAt||0);});
  var tb=toolbar('ideas',R,'backed');
  if(!sorted.length) return h+tb+'<div class="empty"><p>No recommendations in this genre.</p></div>';
  return h+tb+cardList('ideas',sorted,function(it){
    var onList=state.lists.some(function(l){return (l.title||'').toLowerCase()===(it.title||'').toLowerCase();});
    var extra='<p class="meta">Recommended by '+who(it.by)+'</p>'+(it.why?'<p class="quote">'+esc(it.why)+'</p>':'');
    var acts=btn('I would read this &middot; '+count(it.backs),'back',it.id,{pressed:mine(it.backs)})+
      (onList?'<span class="chip">On the reading list</span>':btn('Add to reading list','promote',it.id))+ownBtns('recs',it);
    return bookCard(it,extra,acts);
  });
}

function viewSwap(){
  var S=state.swaps;
  var h=head('Swap shelf','Books you own and will lend. Ask to borrow one and the owner decides.','add-swap','Offer a book');
  if(!state.loaded) return h+loadingBlock();
  if(!S.length) return h+emptyBlock('No books on offer yet','List a book you own and will lend. Friends can ask to borrow it, and you decide who gets it.','add-swap','Offer a book');
  var f=state.filter;
  var shown=S.filter(function(x){
    if(f==='mine') return x.owner===state.uid;
    if(f==='borrow') return x.borrowedBy===state.uid||x.requestedBy===state.uid;
    return true;
  });
  shown=viewItems('swap',shown,function(a,b){var o={available:0,requested:1,lent:2};return (o[a.status]||0)-(o[b.status]||0)||(b.createdAt||0)-(a.createdAt||0);});
  var seg='<div class="seg" role="group" aria-label="Filter books">'+
    btn('All','filter',null,{arg:'all',pressed:f==='all'})+btn('Mine','filter',null,{arg:'mine',pressed:f==='mine'})+btn('Borrowing','filter',null,{arg:'borrow',pressed:f==='borrow'})+'</div>';
  var out=h+seg+toolbar('swap',S,null);
  if(!shown.length) return out+'<div class="empty"><p>'+(state.opts.swap.genre!=='all'?'No books in this genre here.':f==='mine'?'You have not offered any books yet.':'You are not borrowing or asking for anything right now.')+'</p></div>';
  return out+cardList('swap',shown,function(it){
    var chip=it.status==='lent'?'<span class="chip slate">Lent out</span>':it.status==='requested'?'<span class="chip amber">Requested</span>':'<span class="chip">Available</span>';
    var extra='<p class="meta">Owned by '+who(it.owner)+chip+'</p>';
    if(it.status==='requested') extra+='<p class="meta">'+Who(it.requestedBy)+(it.requestedBy===state.uid?' have':' has')+' asked to borrow it.</p>';
    if(it.status==='lent') extra+='<p class="meta">With '+who(it.borrowedBy)+'.</p>';
    if(it.note) extra+='<p class="quote">'+esc(it.note)+'</p>';
    var a='';
    if(it.owner===state.uid){
      if(it.status==='requested') a=btn('Lend to '+who(it.requestedBy),'lend',it.id,{kind:'primary'})+btn('Decline','release',it.id);
      else if(it.status==='lent') a=btn('Mark returned','release',it.id,{kind:'primary'});
      a+=genreBtn('swaps',it,it.owner)+(it.status==='available'?delBtn('swaps',{id:it.id,by:it.owner}):'');
    }else{
      if(it.status==='available') a=btn('Ask to borrow','borrow',it.id,{kind:'primary'});
      else if(it.status==='requested'&&it.requestedBy===state.uid) a=btn('Cancel request','cancel',it.id);
    }
    return bookCard(it,extra,a);
  });
}

function meetupCard(m,isPast){
  var d=new Date(m.t);
  var when=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  var r=m.rsvp||{};
  var ids=Object.keys(r);
  var going=ids.filter(function(k){return r[k]==='yes';});

/* ---------- game corner ---------- */
var COVER_STEPS=6,BLUR=[26,16,9,4.5,1.5,0],STORY_MAX=20;
var GAMES=[['guess','Guess the Book'],['cover','Cover Roulette'],['truths','Two Truths'],['story','Pass the Story']];
var STEPS=[['6','6 hours'],['12','12 hours'],['24','1 day'],['48','2 days']];

function gamesOff(){return !!(state.off.puzzles||state.off.truths||state.off.stories);}
function dur(ms){
  var m=Math.max(1,Math.round(ms/60000));
  if(m>=1440) return Math.floor(m/1440)+'d '+Math.floor((m%1440)/60)+'h';
  if(m>=60) return Math.floor(m/60)+'h '+(m%60)+'m';
  return m+'m';
}
function norm(s){
  var t=String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}+/gu,'').replace(/&/g,' and ').replace(/[^\p{L}\p{N}\s]+/gu,' ').replace(/\s+/g,' ').trim();
  return t.replace(/^(the|a|an) /,'');
}
function lev(a,b){
  // Edit distance where swapping two neighbouring letters counts as one typo.
  var d=[],i,j;
  for(i=0;i<=a.length;i++){d[i]=[i];}
  for(j=1;j<=b.length;j++) d[0][j]=j;
  for(i=1;i<=a.length;i++){
    for(j=1;j<=b.length;j++){
      var c=a[i-1]===b[j-1]?0:1;
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
    }
  }
  return d[a.length][b.length];
}
// Forgiving match: ignores case, accents, punctuation and a leading "The", and allows a small typo in longer titles.
function sameBook(guess,answer){
  var g=norm(guess),a=norm(answer);
  if(!g||!a) return false;
  var tol=a.length>=14?2:a.length>=6?1:0;
  return Math.abs(a.length-g.length)<=tol&&lev(g,a)<=tol;
}
function pzState(p){
  var steps=Math.max(1,p.kind==='cover'?COVER_STEPS:p.clues.length);
  var stepMs=(p.stepHrs||24)*3600e3;
  var elapsed=Math.max(0,Date.now()-(p.createdAt||Date.now()));
  var raw=Math.floor(elapsed/stepMs);
  return {steps:steps,idx:Math.min(raw,steps-1),over:raw>=steps,left:(raw+1)*stepMs-elapsed};
}
function gameScores(){
  var s={};
  function add(u,n){if(u) s[u]=(s[u]||0)+n;}
  state.puzzles.forEach(function(p){Object.keys(p.solves||{}).forEach(function(u){add(u,p.solves[u].pts||0);});});
  state.truths.forEach(function(t){Object.keys(t.picks||{}).forEach(function(u){add(t.picks[u]===t.lie?u:t.by,1);});});
  return s;
}
function gameTodo(){
  var u=state.uid,t={guess:0,cover:0,truths:0,story:0};
  state.puzzles.forEach(function(p){if(p.by!==u&&!(p.solves||{})[u]&&!pzState(p).over&&t[p.kind]!==undefined) t[p.kind]++;});
  state.truths.forEach(function(x){if(x.by!==u&&typeof x.picks[u]!=='number') t.truths++;});
  state.stories.forEach(function(s){if(!s.done&&s.parts.length<STORY_MAX&&s.lastBy!==u) t.story++;});
  return t;
}
function gameTodoTotal(){if(gamesOff()||!state.loaded) return 0;var t=gameTodo();return t.guess+t.cover+t.truths+t.story;}
function section(title,items,fn,none){
  return '<h3 class="label">'+title+'</h3>'+(items.length?'<div class="list">'+items.map(fn).join('')+'</div>':(none?'<div class="empty"><p>'+none+'</p></div>':''));
}
function subHead(title,act,label,lede){
  return '<div class="head sub"><h3>'+esc(title)+'</h3>'+(canWrite()?btn(esc(label),act,null,{kind:'primary'}):'')+'</div><p class="lede">'+esc(lede)+'</p>';
}
function leaderboard(){
  var s=gameScores();
  var rows=state.members.map(function(m){return {id:m.id,n:s[m.id]||0};}).filter(function(r){return r.n>0;}).sort(function(a,b){return b.n-a.n;});
  var out='<h3 class="label">Leaderboard</h3>';
  if(!rows.length) return out+'<p class="meta">Points appear here once someone solves a puzzle or spots a lie.</p>';
  return out+'<ul class="mlist">'+rows.map(function(r,i){
    return '<li class="mrow lb"><span class="rank">'+(i+1)+'</span>'+av(r.id,'sm')+'<span>'+esc(nameOf(r.id,true))+(r.id===state.uid?' <span class="opt">(you)</span>':'')+'</span><b>'+r.n+(r.n===1?' pt':' pts')+'</b></li>';
  }).join('')+'</ul>';
}

function pzCard(p){
  var st=pzState(p),u=state.uid,mineP=p.by===u,sv=(p.solves||{})[u];
  var reveal=mineP||!!sv||st.over;
  var names=Object.keys(p.solves||{}).sort(function(a,b){return p.solves[a].at-p.solves[b].at;});
  var title=reveal?p.answer:(p.kind==='cover'?'Mystery cover':'Mystery book');
  var body='<p class="au">Set by '+who(p.by)+'</p>';
  if(p.kind==='guess'){
    var shown=reveal?p.clues.length:st.idx+1;
    body+='<ol class="clues">'+p.clues.slice(0,shown).map(function(c,i){return '<li><span class="cn">'+(i+1)+'</span><span>'+esc(c)+'</span></li>';}).join('')+'</ol>';
  }else{
    var blur=reveal?0:BLUR[Math.min(st.idx,BLUR.length-1)];
    body+='<div class="cover"><img class="cvimg" src="'+esc(p.cover)+'" alt="'+(reveal?'Cover of '+esc(p.answer):'Blurred book cover')+'" referrerpolicy="no-referrer" loading="lazy" style="filter:blur('+blur+'px);transform:scale('+(blur?1.25:1)+')"></div>';
  }
  if(!reveal){
    var pts=st.steps-st.idx;
    var last=st.idx+1>=st.steps;
    body+='<p class="meta">Worth '+pts+(pts===1?' point':' points')+' right now. '+(last?'Ends in ':(p.kind==='guess'?'Next clue in ':'Clearer in '))+dur(st.left)+'.</p>';
  }else if(sv){
    body+='<p class="meta">You solved it for '+sv.pts+(sv.pts===1?' point':' points')+'.</p>';
  }else if(mineP&&!st.over){
    body+='<p class="meta">Your puzzle. It ends in '+dur(st.left+(st.steps-st.idx-1)*(p.stepHrs||24)*3600e3)+'.</p>';
  }else if(st.over){
    body+='<p class="meta">Time is up. The answer is in the title.</p>';
  }
  body+='<p class="meta">'+(names.length?'Solved by: '+names.map(function(k){return who(k)+' ('+p.solves[k].pts+')';}).join(', '):(st.over?'Nobody solved it.':'No one has solved it yet.'))+'</p>';
  var acts=(!reveal&&canWrite()?btn('Guess','guess',p.id,{kind:'primary'}):'')+delBtn('puzzles',p);
  var ch=reveal?(p.answer||'?').trim().charAt(0).toUpperCase():'?';
  return '<article class="card"><div class="spine s'+hue(p.id)+'" aria-hidden="true">'+esc(ch)+'</div><div class="card-main"><h3 class="bt">'+esc(title)+'</h3>'+body+'</div>'+
    (acts?'<div class="card-actions">'+acts+'</div>':'')+'</article>';
}
function viewPuzzles(kind){
  var isG=kind==='guess';
  var h=subHead(isG?'Guess the Book':'Cover Roulette','add-'+kind,'Set a puzzle',isG?'One clue unlocks at a time. The earlier you name the book, the more points you win.':'The cover starts blurred and clears a little each step. Name the book before it does.');
  var all=state.puzzles.filter(function(p){return p.kind===kind;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  if(!all.length) return h+emptyBlock('No puzzles yet',isG?'Pick a book and write three to five clues, from vague to obvious. Friends guess over the next few days.':'Pick a book, choose its cover, and the group gets a blurred version that clears over six steps.','add-'+kind,'Set a puzzle');
  var u=state.uid,todo=[],play=[],done=[];
  all.forEach(function(p){(pzState(p).over?done:(p.by===u||p.solves[u])?play:todo).push(p);});
  return h+section('To solve',todo,pzCard,'Nothing waiting for you. Check back when someone sets a new puzzle.')+
    (play.length?section('In play',play,pzCard):'')+(done.length?section('Finished',done,pzCard):'');
}

function truthCard(t){

  var ids=Object.keys(t.picks),fooled=ids.filter(function(k){return t.picks[k]!==t.lie;});

    if(!reveal){
      var armed=state.armed==='pick/'+t.id+'/'+i;
      return '<button type="button" class="stmt'+(armed?' armed':'')+'" data-act="pick" data-id="'+esc(t.id)+'" data-arg="'+i+'"><span class="cn">'+(i+1)+'</span><span>'+esc(s)+(armed?'<br><b>Tap again to lock in your answer</b>':'')+'</span></button>';
    }

    mineT?'<p class="meta">'+(ids.length?fooled.length+' of '+ids.length+' fooled. You earn a point for each person you fool.':'No votes yet. You earn a point for each person you fool.')+'</p>':'';
  var d=delBtn('truths',t);
  return '<article class="card"><div class="spine s'+hue(t.book)+'" aria-hidden="true">'+esc((t.book||'?').trim().charAt(0).toUpperCase())+'</div><div class="card-main"><h3 class="bt">'+esc(t.book)+'</h3>'+
    '<p class="au">Set by '+who(t.by)+(reveal?'':'. Which one is the lie?')+'</p><div class="stmts">'+list+'</div>'+res+'</div>'+(d?'<div class="card-actions">'+d+'</div>':'')+'</article>';
}

function findCovers(){
  var t=$('#f-title'),a=$('#f-author'),res=$('#cvres'),err=$('#sheet-err');
  if(!t||!res) return;
  var title=t.value.trim();
  if(!title){err.textContent='Enter the title first.';t.focus();return;}
  err.textContent='';
  res.innerHTML='<p class="meta">Searching&hellip;</p>';
  var q='https://openlibrary.org/search.json?limit=12&fields=title,cover_i&title='+encodeURIComponent(title)+(a&&a.value.trim()?'&author='+encodeURIComponent(a.value.trim()):'');
  fetch(q).then(function(r){if(!r.ok) throw new Error('bad');return r.json();}).then(function(j){
    var seen={},ids=[];
    (j.docs||[]).forEach(function(d){if(d.cover_i&&!seen[d.cover_i]){seen[d.cover_i]=1;ids.push(d.cover_i);}});
    ids=ids.slice(0,8);
    if(!ids.length){res.innerHTML='<p class="meta">No covers found. Try adding the author, or paste an image link instead.</p>';return;}
    res.innerHTML='<p class="meta">Tap the cover to use.</p><div class="cvgrid">'+ids.map(function(id){
      var u='https://covers.openlibrary.org/b/id/'+id+'-M.jpg';
      return '<button type="button" class="cvpick" data-act="pickcover" data-arg="'+esc(u)+'" aria-pressed="'+(state.pickedCover===u)+'" aria-label="Use this cover"><img src="'+esc(u)+'" alt="" loading="lazy"></button>';
    }).join('')+'</div>';
  }).catch(function(){res.innerHTML='<p class="meta">Could not search covers just now. Paste an image link instead.</p>';});
}

/* ---------- sign-in gate ---------- */
function fieldHtml(f,prefix){
  var id=(prefix||'f-')+f.id;
  if(f.type==='checkbox') return '<div class="checkrow"><label for="'+id+'"><input type="checkbox" id="'+id+'" name="'+f.id+'"> '+esc(f.label)+'</label></div>';
  var lab='<label for="'+id+'">'+esc(f.label)+(f.required?'':' <span class="opt">optional</span>')+'</label>';
  var ctl=f.type==='select'?'<select id="'+id+'" name="'+f.id+'">'+(f.options?
      f.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(f.value)?' selected':'')+'>'+esc(o[1])+'</option>';}).join(''):
      '<option value="">'+esc(f.blank||'Not set')+'</option>'+GENRES.map(function(g){return '<option'+(g===f.value?' selected':'')+'>'+esc(g)+'</option>';}).join(''))+'</select>':
    f.type==='textarea'?'<textarea id="'+id+'" name="'+f.id+'" maxlength="'+(f.max||600)+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(f.value||'')+'</textarea>':
    '<input id="'+id+'" name="'+f.id+'" type="'+(f.type||'text')+'" maxlength="'+(f.max||140)+'" placeholder="'+esc(f.placeholder||'')+'" value="'+esc(f.value||'')+'" autocomplete="'+(f.auto||'off')+'">';
  return '<div class="field">'+lab+ctl+'</div>';
}
function showGate(mode){
  gateMode=mode;
  $('#boot').hidden=true;
  $('#app').hidden=true;$('#gate').hidden=false;
  var f=$('#gate-fields'),help=$('#gate-help'),sub=$('#gate-submit');
  $('#gate-err').textContent='';
  $('#gate-reset').hidden=mode!=='signin';
  sub.hidden=false;help.textContent='';
  if(mode==='config'){
    f.innerHTML='<p class="lede">Setup needed. Add your Firebase settings to config.js, then reload this page. The README has the steps.</p>';
    sub.hidden=true;return;
  }
  if(mode==='loading'){f.innerHTML='<p class="lede">Loading&hellip;</p>';sub.hidden=true;return;}
  if(mode==='denied'){
    f.innerHTML='<p class="lede">This account is not on the club guest list yet. Ask whoever runs the club to add your email, then sign in again.</p>';
    sub.textContent='Sign out';return;
  }
  if(mode==='signin'){
    f.innerHTML=fieldHtml({id:'email',label:'Email',required:true,type:'email',auto:'username',max:254},'g-')+
      fieldHtml({id:'password',label:'Password',required:true,type:'password',auto:'current-password',max:128},'g-');
    sub.textContent='Sign in';help.textContent='Invite only. Ask whoever runs the club for an account.';
  }else{
    f.innerHTML=fieldHtml({id:'nick',label:'What should the group call you?',required:true,max:40},'g-');
    sub.textContent='Join the club';help.textContent='The others see this name next to your books and replies.';
  }

}
$('#gate-form').addEventListener('submit',function(e){

    var email=$('#g-email').value.trim(),pw=$('#g-password').value;
    if(!email||!pw){err.textContent='Enter your email and password.';return;}
    b.disabled=true;
    FAUTH.signInWithEmailAndPassword(auth,email,pw).catch(function(x){
      var c=x&&x.code;
      err.textContent=c==='auth/network-request-failed'?'Could not reach the server. Check your connection.':
        c==='auth/too-many-requests'?'Too many attempts. Wait a few minutes and try again.':
        'That email and password did not match. Check them, or ask whoever runs the club.';
    }).then(function(){b.disabled=false;});
  }else if(gateMode==='name'){
    var nick=$('#g-nick').value.trim();
    if(!nick){err.textContent='Enter a name.';return;}
    b.disabled=true;
    saveNick(nick).catch(function(x){err.textContent=writeError(x);}).then(function(){b.disabled=false;});
  }else if(gateMode==='denied'){

$('#gate-reset').addEventListener('click',function(){

  $('#sheet-extra').innerHTML=o.extra||'';
  $('#sheet-err').textContent='';
  var sb2=$('#sheet-submit');sb2.textContent=o.submit||'Save';sb2.hidden=!o.onSubmit;

$('#sheet-form').addEventListener('submit',function(e){
  e.preventDefault();
  var o=sheetOpts;if(!o||!o.onSubmit) return;
  var vals={};
  for(var i=0;i<(o.fields||[]).length;i++){
    var f=o.fields[i];var el=$('#f-'+f.id);
    vals[f.id]=f.type==='checkbox'?el.checked:f.type==='password'?(el.value||''):(el.value||'').trim();
    if(f.required&&!vals[f.id]){$('#sheet-err').textContent=f.label+' is required.';el.focus();return;}
  }
  var b=$('#sheet-submit');b.disabled=true;
  Promise.resolve().then(function(){
    if(!canWrite()) throw {userMessage:'Sign in and pick a name first.'};
    return o.onSubmit(vals);
  }).then(function(){
    if(o.keepOpen){(o.fields||[]).forEach(function(f){var el=$('#f-'+f.id);if(el){if(f.type==='checkbox') el.checked=false; else el.value='';}});var t=$('#sheet-body textarea');if(t) t.focus();}
    else closeSheet();

});

function commentsFor(id){return state.comments.filter(function(c){return c.bookId===id;}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});}
function unreadFor(id){
  if(!state.seenReady||state.commentsOff) return 0;
  var at=state.seen[id]||0;
  return commentsFor(id).filter(function(c){return c.by!==state.uid&&c.createdAt>at;}).length;
}
function unreadBooks(){return state.lists.map(function(b){return {b:b,n:unreadFor(b.id)};}).filter(function(x){return x.n>0;});}
function markSeen(id){
  var newest=0;
  if(!state.seenReady||state.seenOff||state.commentsOff) return;
  var at=state.seen[id]||0;
  commentsFor(id).forEach(function(c){if(c.by!==state.uid&&c.createdAt>at&&c.createdAt>newest) newest=c.createdAt;});
  if(!newest||(state.marked[id]||0)>=newest) return;
  state.marked[id]=newest;
  var m={};m[id]=FS.serverTimestamp();
  FS.setDoc(ref('reads',state.uid),{seen:m},{merge:true}).catch(function(){state.marked[id]=0;});
}
function discussBtn(it){
  if(state.commentsOff) return '';
  var n=commentsFor(it.id).length,u=unreadFor(it.id);
  return btn('Discuss'+(n?' &middot; '+n:'')+(u?' &middot; '+u+' new':''),'discuss',it.id,{kind:u?'newc':'quiet'});
}
function threadHtml(){
  var list=commentsFor(state.discuss);
  if(!list.length) return '<p class="lede">No comments yet. Start the conversation. If you are talking about the ending, tick the spoiler box so others can choose when to read it.</p>';
  return list.map(function(c){
    var when=c.createdAt?new Date(c.createdAt).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'sending';
    var body=c.spoiler&&!state.shown[c.id]&&c.by!==state.uid
      ?'<p class="spoiler">'+btn('Spoiler. Tap to read','reveal',c.id,{kind:'quiet'})+'</p>'
      :'<p class="ctext">'+(c.spoiler?'<span class="chip">Spoiler</span> ':'')+esc(c.text)+'</p>';
    var isNew=c.by!==state.uid&&state.seenReady&&c.createdAt>state.openSeen;
    return '<div class="comment'+(isNew?' new':'')+'">'+av(c.by,'sm')+'<div class="cbody"><p class="meta"><b>'+who(c.by)+'</b> &middot; '+when+(isNew?' <span class="chip">New</span>':'')+'</p>'+body+delBtn('comments',c)+'</div></div>';
  }).join('');
}
function refreshThread(){
  var el=$('#thread');if(!el||!state.discuss) return;
  var near=el.scrollHeight-el.scrollTop-el.clientHeight<80;
  var key=document.activeElement&&el.contains(document.activeElement)?document.activeElement.dataset.id:null;
  el.innerHTML=threadHtml();
  if(near) el.scrollTop=el.scrollHeight;
  markSeen(state.discuss);
  if(key){var f=el.querySelector('[data-id="'+key+'"]');if(f) f.focus();}
}
function openDiscuss(id){
  var bk=state.lists.find(function(x){return x.id===id;});if(!bk) return;
  state.discuss=id;
  openSheet({title:bk.title,intro:'Discussion'+(bk.author?' of '+bk.title+' by '+bk.author:''),submit:'Post comment',keepOpen:true,
    html:'<div id="thread" class="thread" aria-live="polite"></div>',
    fields:[{id:'text',label:'Add to the discussion',type:'textarea',required:true,max:1000},{id:'spoiler',label:'This comment has spoilers',type:'checkbox'}],
    onSubmit:function(v){
      return FS.addDoc(colRef('comments'),{bookId:id,text:v.text,spoiler:!!v.spoiler,createdBy:state.uid,createdAt:FS.serverTimestamp()});
    }});

/* ---------- events ---------- */
function act(a,id,arg){
  switch(a){
    case 'add-book':return openAddBook();
    case 'add-idea':return openAddIdea();
    case 'add-swap':return openAddSwap();
    case 'add-meetup':return openAddMeetup();
    case 'add-guess':return openAddGuess();
    case 'add-cover':return openAddCover();
    case 'add-truth':return openAddTruth();
    case 'add-story':return openAddStory();
    case 'members':return openMembers();
    case 'install':return installApp();
    case 'setgenre':return openGenre(arg,id);
    case 'group':{var go=state.opts[curTab()];go.group=!go.group;return render();}
    case 'discuss':return openDiscuss(id);
    case 'reveal':state.shown[id]=true;return refreshThread();
    case 'signout':closeSheet();return FAUTH.signOut(auth);
    case 'vote':{var bk=state.lists.find(function(x){return x.id===id;});if(!bk) return;return guarded('vote'+id,function(){return toggleMap('books',id,'votes',mine(bk.votes));});}
    case 'start':return setReader(id,'reading');
    case 'finish':return setReader(id,'done');
    case 'unstart':return guarded('book'+id,function(){return FS.updateDoc(ref('books',id),mapField('readers',FS.deleteField()));});
    case 'rate':return guarded('rate'+id,function(){return FS.updateDoc(ref('books',id),mapField('ratings',Number(arg)));});
    case 'back':{var rc=state.recs.find(function(x){return x.id===id;});if(!rc) return;return guarded('back'+id,function(){return toggleMap('ideas',id,'backs',mine(rc.backs));});}
    case 'promote':return promote(id);
    case 'borrow':return borrow(id);
    case 'cancel':return patchDoc('swap'+id,'swaps',id,{status:'available',requestedBy:''});
    case 'release':return patchDoc('swap'+id,'swaps',id,{status:'available',requestedBy:'',borrowedBy:''});
    case 'lend':{var sw=state.swaps.find(function(x){return x.id===id;});if(!sw||!sw.requestedBy) return;return patchDoc('swap'+id,'swaps',id,{status:'lent',borrowedBy:sw.requestedBy,requestedBy:''});}
    case 'rsvp':return guarded('rsvp'+id,function(){return FS.updateDoc(ref('meetups',id),mapField('rsvp',arg));});
    case 'copy':return copyMeetup(id);
    case 'del':return del(arg,id);
    case 'filter':state.filter=arg;return render();
    case 'gtab':state.gameTab=arg;return render();
    case 'guess':return openGuess(id);
    case 'findcovers':return findCovers();
    case 'pickcover':{
      state.pickedCover=arg;
      document.querySelectorAll('#cvres .cvpick').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.arg===arg?'true':'false');});
      return;
    }
    case 'pick':{
      var tq=state.truths.find(function(x){return x.id===id;});if(!tq) return;
      if(!twoTap('pick/'+id+'/'+arg)) return;
      return guarded('pick'+id,function(){
        return FS.updateDoc(ref('truths',id),mapField('picks',Number(arg))).then(function(){
          toast(Number(arg)===tq.lie?'You spotted the lie. +1 point.':'The lie fooled you this time.');
        });
      });
    }
    case 'addpart':return openAddPart(id);
    case 'finishstory':if(!twoTap('finish/'+id)) return;return patchDoc('story'+id,'stories',id,{done:true});
  }
}

/* ---------- boot ---------- */
var configured=CFG.apiKey&&CFG.projectId&&!/YOUR-/.test(CFG.apiKey+CFG.projectId+(CFG.appId||''));
$('#boot').hidden=true;
if(!configured){showGate('config');return;}
var fbApp=FA.initializeApp({apiKey:CFG.apiKey,authDomain:CFG.authDomain,projectId:CFG.projectId,appId:CFG.appId});
auth=FAUTH.getAuth(fbApp);
db=FS.getFirestore(fbApp);
FAUTH.onAuthStateChanged(auth,setUser);
// Keep the clue countdowns fresh while someone has the Games tab open.
setInterval(function(){if(!$('#app').hidden&&$('#sheet').hidden&&curTab()==='games') render();},60000);
})();
</script>
